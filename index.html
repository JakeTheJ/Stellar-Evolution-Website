<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Selector — Ad Astra Stellar Evolution Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sky" id="sky"></div>

  <header class="masthead">
    <div class="masthead-inner">
      <span class="wordmark">AD ASTRA</span>
      <span class="tagline">Astronomy &amp; Science Club</span>
    </div>
  </header>

  <main class="stage">

    <div class="stage-copy">
      <h1>Star Selector</h1>
      <p class="subhead">Choose a stellar class to preview how mass and temperature shape a star's size and color.</p>
    </div>

    <div class="viewport">
      <div class="orbit-ring" aria-hidden="true"></div>
      <div class="star" id="star"></div>
      <p class="readout" id="readout">Select a star class below</p>
    </div>

    <div class="selector" role="group" aria-label="Star class selector">
      <button class="star-btn" data-star="red-dwarf" style="--swatch:#c1440e">
        <span class="btn-swatch"></span>
        <span class="btn-label">Red Dwarf</span>
        <span class="btn-meta">M-type · smallest, coolest</span>
      </button>
      <button class="star-btn" data-star="yellow-dwarf" style="--swatch:#f4c542">
        <span class="btn-swatch"></span>
        <span class="btn-label">Yellow Dwarf</span>
        <span class="btn-meta">G-type · our own Sun's class</span>
      </button>
      <button class="star-btn" data-star="blue-giant" style="--swatch:#5fc9f8">
        <span class="btn-swatch"></span>
        <span class="btn-label">Blue Giant</span>
        <span class="btn-meta">O/B-type · hot and massive</span>
      </button>
      <button class="star-btn" data-star="red-giant" style="--swatch:#e8613c">
        <span class="btn-swatch"></span>
        <span class="btn-label">Red Giant</span>
        <span class="btn-meta">late-stage · swollen and cool</span>
      </button>
    </div>

  </main>

  <footer class="foot">
    <p>Induction Task 2 — RNT Team</p>
  </footer>

<script src="script.js"></script>
</body>
</html>
